name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests, Python ${{ matrix.python-version }} (no live databases)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.12 evaluates annotations eagerly at def time while 3.14 defers
      # them (PEP 649): a missing import like `Any` passes locally on 3.14
      # and breaks collection on 3.12, so both must run.
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Collect-only smoke test (must not open connections)
        run: python -m pytest tests/ --collect-only -q
      - name: Run tests (live tests skip without databases)
        run: python -m pytest tests/ -q

  integration:
    name: Integration tests, Python ${{ matrix.python-version }} (disposable live databases, mandatory)
    runs-on: ubuntu-latest
    strategy:
      # A failure on one Python version must not cancel the other leg,
      # otherwise its signal is lost ("operation was canceled").
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    services:
      firebird:
        # NOTE: there is no plain "4.0" tag; use a pinned release tag
        # (see https://github.com/FirebirdSQL/firebird-docker#supported-tags).
        image: firebirdsql/firebird:4.0.7
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_DATABASE: firebird2postgres_test.fdb
        ports:
          - 3050:3050
    env:
      # Explicit disposable test databases — never the production ones.
      TEST_PG_HOST: localhost
      TEST_PG_PORT: 5432
      TEST_PG_DB: firebird2postgres_test
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_FB_HOST: localhost
      TEST_FB_PORT: 3050
      TEST_FB_DATABASE: /var/lib/firebird/data/firebird2postgres_test.fdb
      TEST_FB_USER: sysdba
      TEST_FB_PASSWORD: masterkey
      # Mandatory stage: unavailable databases must FAIL, never skip.
      REQUIRE_INTEGRATION: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build disposable PostgreSQL with plpgsql_check
        # Stock postgres images lack plpgsql_check, required by
        # TestValidatePostgresDdlRegression setUp. Services cannot use
        # locally built images (they start before steps run), so build
        # here and start the container manually below.
        run: docker build -t pg-plpgsql-check:16 -f .github/docker/Dockerfile.postgres .github/docker
      - name: Start disposable PostgreSQL
        run: |
          docker run -d --name pg-test \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=firebird2postgres_test \
            -p 5432:5432 pg-plpgsql-check:16
      - name: Wait for disposable databases
        # The Firebird service has no Docker healthcheck; poll both
        # databases so strict mode (REQUIRE_INTEGRATION=1) never fails
        # on a slow container start instead of a real regression.
        run: |
          python - <<'EOF'
          import time
          import firebirdsql
          import psycopg2

          deadline = time.time() + 180
          pg_ok = fb_ok = False
          while time.time() < deadline and not (pg_ok and fb_ok):
              if not pg_ok:
                  try:
                      conn = psycopg2.connect(
                          host='localhost', port=5432,
                          dbname='firebird2postgres_test',
                          user='postgres', password='postgres',
                          connect_timeout=3,
                      )
                      conn.close()
                      pg_ok = True
                  except Exception:
                      pass
              if not fb_ok:
                  try:
                      conn = firebirdsql.connect(
                          host='localhost', port=3050,
                          database='/var/lib/firebird/data/firebird2postgres_test.fdb',
                          user='sysdba', password='masterkey',
                      )
                      cur = conn.cursor()
                      cur.execute('SELECT 1 FROM RDB$DATABASE;')
                      assert cur.fetchone()[0] == 1
                      conn.close()
                      fb_ok = True
                  except Exception:
                      pass
              if not (pg_ok and fb_ok):
                  time.sleep(3)
          assert pg_ok, 'PostgreSQL service did not become ready in time'
          assert fb_ok, 'Firebird service did not become ready in time'
          print('Disposable databases ready (postgres + firebird).')
          EOF
      - name: Run full suite against live disposable databases
        run: python -m pytest tests/ -q
